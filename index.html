<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamalli Stock</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b0f14;
  color:#fff;
}
.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}
h1{margin:5px 0 4px;font-size:30px}
.subtitle{color:#8e98a7;margin-bottom:25px}
.card{
  background:#151b23;
  border:1px solid #29313c;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
}
input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border-radius:12px;
  border:1px solid #394350;
  background:#0d1218;
  color:#fff;
  font-size:16px;
}
button{
  border:0;
  border-radius:12px;
  padding:13px 17px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}
.primary{background:#39d98a;color:#06120c;width:100%}
.secondary{background:#26303c;color:#fff}
.danger{background:#d94b5b;color:#fff}
.row{display:flex;gap:8px}
.row>*{flex:1}
.hidden{display:none}
.search{margin-bottom:15px}
.product{
  background:#151b23;
  border:1px solid #29313c;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
}
.product-name{
  font-size:19px;
  font-weight:800;
}
.sku{color:#8e98a7;font-size:14px;margin-top:4px}
.qty{
  font-size:32px;
  font-weight:900;
  margin:12px 0;
}
.low{color:#ffb84d}
.out{color:#ff5f6d}
.ok{color:#39d98a}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
.logout{
  background:#252c36;
  color:#fff;
  padding:9px 12px;
}
label{
  display:block;
  color:#aeb7c3;
  font-size:14px;
  margin-top:8px;
}
.message{
  padding:12px;
  border-radius:10px;
  background:#202833;
  margin-bottom:12px;
  color:#cbd3dd;
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <section id="loginPage">

    <div class="card">
      <h1>Gamalli Stock</h1>
      <div class="subtitle">ระบบจัดการสต๊อกสินค้า</div>

      <div id="loginMessage"></div>

      <label>Email</label>
      <input id="email" type="email" placeholder="อีเมล">

      <label>Password</label>
      <input id="password" type="password" placeholder="รหัสผ่าน">

      <button class="primary" onclick="login()">เข้าสู่ระบบ</button>

      <div style="height:10px"></div>

      <button type="button" class="secondary" style="width:100%" onclick="register()">
  สมัครสมาชิก
</button>
     
    </div>

  </section>


  <!-- STOCK APP -->
  <section id="stockPage" class="hidden">

    <div class="top">
      <div>
        <h1>Gamalli Stock</h1>
        <div class="subtitle">คลังสินค้ากลาง</div>
      </div>

      <button class="logout" onclick="logout()">ออกจากระบบ</button>
    </div>

    <div id="appMessage"></div>

    <div class="card">

      <h2>เพิ่มสินค้า</h2>

      <label>รหัสสินค้า / SKU</label>
      <input id="sku" placeholder="เช่น GM001">

      <label>ชื่อสินค้า</label>
      <input id="name" placeholder="เช่น เสื้อยืดสีขาว">

      <label>จำนวนเริ่มต้น</label>
      <input id="quantity" type="number" value="0">

      <button class="primary" onclick="addProduct()">
        + เพิ่มสินค้า
      </button>

    </div>


    <input
      class="search"
      id="search"
      placeholder="🔎 ค้นหาสินค้า..."
      oninput="renderProducts()"
    >

    <div id="products"></div>

  </section>

</div>


<script>

const SUPABASE_URL =
"https://hhsjkskudbymgkweycpc.supabase.co";

const SUPABASE_KEY =
"sb_publishable_gjbZH9Aka_8Vex_YU9iP4A_t8eR8j37";

const supabaseClient =
supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let products=[];


// -----------------------------
// MESSAGE
// -----------------------------

function message(id,text){
  document.getElementById(id).innerHTML =
    `<div class="message">${text}</div>`;
}


// -----------------------------
// LOGIN
// -----------------------------

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){
    message("loginMessage","กรุณากรอก Email และ Password");
    return;
  }

  const {error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    message("loginMessage",error.message);
    return;
  }

  showStock();
}


// -----------------------------
// REGISTER
// -----------------------------

async function register(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){
    message(
      "loginMessage",
      "กรุณากรอก Email และ Password"
    );
    return;
  }

  if(password.length < 6){
    message(
      "loginMessage",
      "Password ต้องมีอย่างน้อย 6 ตัวอักษร"
    );
    return;
  }

  try {

    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

    if(error){
      console.error("REGISTER ERROR:", error);

      message(
        "loginMessage",
        "สมัครสมาชิกไม่สำเร็จ: " + error.message
      );

      return;
    }

    console.log("REGISTER SUCCESS:", data);

    message(
      "loginMessage",
      "สมัครสมาชิกสำเร็จแล้ว กรุณาตรวจสอบอีเมลเพื่อยืนยันบัญชี"
    );

  } catch(err){

    console.error("REGISTER EXCEPTION:", err);

    message(
      "loginMessage",
      "เกิดข้อผิดพลาด: " + err.message
    );
  }
}
